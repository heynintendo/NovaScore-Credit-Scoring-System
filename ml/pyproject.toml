[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novascore"
version = "0.2.0"
description = "Equitable credit scoring engine for gig-economy partners: FT-Transformer + TCN + Node2Vec hybrid model with fairness mitigation."
authors = [
    { name = "Anupam Kumar" },
    { name = "Anish Kishore" },
    { name = "Swaraj Thakur" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "lightgbm>=4.3",
    "torch>=2.2",
    "networkx>=3.2",
    "node2vec>=0.4.6",
    "gensim>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
novascore = "novascore.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["novascore*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
